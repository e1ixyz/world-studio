<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="0.62" stop-color="#05080d"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#3cf2ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3cf2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#9fb7cc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff7ff"/>
      <stop offset="1" stop-color="#1fb8c9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cf2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3cf2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- perspective floor grid -->
    <g stroke="url(#floor)" stroke-width="4" fill="none">
      <path d="M412 742 L250 924"/>
      <path d="M612 742 L774 924"/>
      <path d="M312 742 L-10 924"/>
      <path d="M712 742 L1034 924"/>
    </g>

    <!-- skyline -->
    <rect x="252" y="452" width="132" height="290" rx="10" fill="url(#cyan)"/>
    <rect x="446" y="232" width="132" height="510" rx="10" fill="url(#tower)"/>
    <rect x="496" y="176" width="32" height="60" rx="6" fill="#eef6ff"/>
    <rect x="640" y="372" width="132" height="370" rx="10" fill="url(#cyan)"/>

    <!-- windows -->
    <g fill="#05080d" opacity="0.55">
      <rect x="474" y="282" width="28" height="22" rx="3"/><rect x="522" y="282" width="28" height="22" rx="3"/>
      <rect x="474" y="334" width="28" height="22" rx="3"/><rect x="522" y="334" width="28" height="22" rx="3"/>
      <rect x="474" y="386" width="28" height="22" rx="3"/><rect x="522" y="386" width="28" height="22" rx="3"/>
      <rect x="474" y="438" width="28" height="22" rx="3"/><rect x="522" y="438" width="28" height="22" rx="3"/>
      <rect x="474" y="490" width="28" height="22" rx="3"/><rect x="522" y="490" width="28" height="22" rx="3"/>
      <rect x="474" y="542" width="28" height="22" rx="3"/><rect x="522" y="542" width="28" height="22" rx="3"/>
      <rect x="474" y="594" width="28" height="22" rx="3"/><rect x="522" y="594" width="28" height="22" rx="3"/>
    </g>
    <g fill="#05080d" opacity="0.35">
      <rect x="280" y="500" width="28" height="22" rx="3"/><rect x="328" y="500" width="28" height="22" rx="3"/>
      <rect x="280" y="552" width="28" height="22" rx="3"/><rect x="328" y="552" width="28" height="22" rx="3"/>
      <rect x="280" y="604" width="28" height="22" rx="3"/><rect x="328" y="604" width="28" height="22" rx="3"/>
      <rect x="668" y="420" width="28" height="22" rx="3"/><rect x="716" y="420" width="28" height="22" rx="3"/>
      <rect x="668" y="472" width="28" height="22" rx="3"/><rect x="716" y="472" width="28" height="22" rx="3"/>
      <rect x="668" y="524" width="28" height="22" rx="3"/><rect x="716" y="524" width="28" height="22" rx="3"/>
      <rect x="668" y="576" width="28" height="22" rx="3"/><rect x="716" y="576" width="28" height="22" rx="3"/>
    </g>

    <!-- horizon line -->
    <rect x="100" y="738" width="824" height="8" fill="#3cf2ff"/>
  </g>

  <!-- subtle rim -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
</svg>
